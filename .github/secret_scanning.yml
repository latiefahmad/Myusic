# Secret-scanning exclusions

The iOS tests replay real YouTube and Musixmatch responses, and the po-token
client needs the BotGuard key YouTube's own web client uses. Those captured
payloads therefore contain `AIza…` client keys, and GitHub's Google API key
pattern matches them.

None of these values are credentials of this project:

- they are public client keys that ship inside youtube.com and Musixmatch's web
  app (the Python/Java clients of every YouTube front end use the same ones);
- they were already public in the upstream BitChord repository;
- the BotGuard key appears in `PoTokenWebView.kt` and `PoTokenChallenge.swift`
  only because the Android and iOS po-token implementations must use it.

Excluding exactly these paths keeps the noise down without hiding a real leak
anywhere else in the repository. See `SECURITY.md` for the full note.

paths-ignore:
  # Recorded InnerTube / Musixmatch responses used by the tests.
  - "ios/MyusicKit/Tests/**/Fixtures/**"
  # YouTube's public BotGuard key, in the two po-token clients.
  - "ios/MyusicKit/Sources/StreamResolution/PoToken/PoTokenChallenge.swift"
  - "app/src/main/java/com/music/myusic/data/innertube/potoken/PoTokenWebView.kt"
