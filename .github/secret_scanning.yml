# Secret-scanning exclusions
#
# The iOS tests replay real YouTube and Musixmatch responses, and the po-token
# client needs the BotGuard key YouTube's own web client uses. Those captured
# payloads therefore contain `AIza…` client keys, and GitHub's Google API key
# pattern matches them.
#
# None of these values are credentials of this project:
#
# - they are public client keys that ship inside youtube.com and Musixmatch's web
#   app (every third-party YouTube client uses the same ones);
# - they were already public in the upstream BitChord repository;
# - the BotGuard key appears in `PoTokenWebView.kt` and `PoTokenChallenge.swift`
#   only because the Android and iOS po-token implementations must use it.
#
# The list is deliberately exact — three recorded fixtures and two source lines —
# so a real secret committed anywhere else in the repository is still reported.
# See `SECURITY.md` for the full note.

paths-ignore:
  # Recorded InnerTube responses (`INNERTUBE_API_KEY` of youtube.com).
  - "ios/ZMyusicKit/Tests/InnerTubeTests/Fixtures/"
  - "ios/ZMyusicKit/Tests/StreamResolutionTests/Fixtures/"
  # A recorded Musixmatch app config; its user token is already REDACTED.
  - "ios/ZMyusicKit/Tests/LyricsTests/Fixtures/"
  # YouTube's public BotGuard key, in the two po-token clients.
  - "ios/ZMyusicKit/Sources/StreamResolution/PoToken/PoTokenChallenge.swift"
  - "app/src/main/java/com/zmyusic/zmyusic/data/innertube/potoken/PoTokenWebView.kt"
