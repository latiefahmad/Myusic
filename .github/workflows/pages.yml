name: Pages

# Publishes the landing page in docs/ to GitHub Pages. The page is static:
# plain HTML, CSS and a little vanilla JS, with no build step, so the artifact
# is just the docs/ folder.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue one behind it rather than cancelling, so
# the site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # The repository has never published a Pages site, so let this step
          # create it (GitHub Actions as the source) on the first run instead of
          # failing with "Get Pages site failed".
          enablement: true

      - name: Upload the docs folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
