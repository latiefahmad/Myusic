name: Android Release APK

on:
  push:
    branches: [main]
    tags: ["ZMyusic-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A signed prod build needs the release key. Until those secrets exist the
  # build could only fail on every push, so check for them first and skip the
  # job instead. Once KEYSTORE_BASE64 is set the job starts running by itself.
  signing-key:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KEYSTORE_BASE64 secret yet; skipping the signed build."
          fi

  build-prod-release:
    needs: signing-key
    if: needs.signing-key.outputs.ready == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # The tag is what the updater compares against, so it has to name the
    # version baked into the APK. See .github/scripts/verify-release-tag.sh.
    - name: Verify the tag matches the app version
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # compileSdk 37 ships as platforms;android-37.0, while AGP looks for
    # platforms/android-37. The runner image has neither.
    - name: Android SDK 37, NDK and CMake
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null
        "$SDKMANAGER" "platforms;android-37.0" "ndk;27.0.12077973" "cmake;3.22.1"
        ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

    # Android refuses an update whose versionCode is not higher than the
    # installed one, and the updater compares versionName. Both have to move,
    # so check the code against the last published APK rather than trusting
    # the bump by hand. The check is skipped when there is no earlier APK.
    - name: The versionCode must be higher than the last release's
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
        if [ -z "$latest" ] || [ "$latest" = "$GITHUB_REF_NAME" ]; then
          echo "No earlier published release to compare with."
          exit 0
        fi
        url="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.assets[] | select(.name | endswith("-android-phone-universal.apk")) | .browser_download_url' | head -n1)"
        if [ -z "$url" ]; then
          echo "::warning::The latest release has no phone universal APK; skipping the versionCode check."
          exit 0
        fi
        if ! curl -fsSL "$url" -o "$RUNNER_TEMP/latest.apk"; then
          echo "::warning::Could not download the last APK; skipping the versionCode check."
          exit 0
        fi
        aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
        [ -n "$aapt" ] || aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)"
        if [ -z "$aapt" ]; then
          echo "::warning::No aapt/aapt2 on this runner; skipping the versionCode check."
          exit 0
        fi
        old="$("$aapt" dump badging "$RUNNER_TEMP/latest.apk" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
        new="$(sed -n 's/^extra\["zmyusicVersionCode"\] = \([0-9]*\)/\1/p' build.gradle.kts | tr -d '\r')"
        echo "Last release $latest has versionCode $old; this release has $new."
        if [ -z "$old" ] || [ -z "$new" ]; then
          echo "::warning::Could not read a versionCode; skipping the check."
          exit 0
        fi
        if [ "$new" -le "$old" ]; then
          echo "::error::zmyusicVersionCode must increase: $new is not greater than $old from $latest."
          exit 1
        fi

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zmyusic-release.jks
        {
          echo "storeFile=zmyusic-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zmyusic-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zmyusic-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    # Android TV is its own module with its own applicationId; the phone
    # artifact never covered it.
    - name: Upload Android TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zmyusic-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk

    # A tag is a release: the phone, TV and watch APKs belong on it next to the
    # desktop installers, under names that say which device they go on.
    - name: Name the APKs for the release
      if: github.ref_type == 'tag'
      run: |
        v="${GITHUB_REF_NAME#ZMyusic-v}"
        mkdir -p dist
        for f in app/build/outputs/apk/prod/release/*.apk; do
          abi=$(basename "$f" | sed -E 's/^app-prod-(.*)-release\.apk$/\1/')
          cp "$f" "dist/ZMyusic-$v-android-phone-$abi.apk"
        done
        for f in tv/build/outputs/apk/prod/release/*.apk; do
          abi=$(basename "$f" | sed -E 's/^tv-prod-(.*)-release\.apk$/\1/')
          cp "$f" "dist/ZMyusic-$v-android-tv-$abi.apk"
        done
        cp wearos/build/outputs/apk/prod/release/*.apk "dist/ZMyusic-$v-android-wear.apk"
        ls -lh dist

    - name: Attach the APKs to the draft release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        files: dist/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
