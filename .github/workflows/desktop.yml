name: Desktop Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux - AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pmyusic.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pmyusic.version=${{ steps.version.outputs.value }}

      # A jar without the analyser or the models still starts, and quietly
      # loses Automix: exactly the failure this check exists to catch.
      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Myusic/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libmyusic_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/Myusic \
            dist/Myusic-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/Myusic-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/Myusic-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows - installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The analyser and the WinRT media bridge both need a MinGW C++ compiler.
      # The image ships MSYS2 at C:\msys64, but no mingw64 toolchain and nothing on
      # PATH, so install g++ into it when it is not already there. Ninja and CMake
      # are preinstalled.
      - name: MinGW on PATH
        shell: pwsh
        run: |
          $gpp = (Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          if (-not $gpp) {
            $dir = @(
              "C:\msys64\mingw64\bin",
              "C:\msys64\ucrt64\bin",
              "C:\ProgramData\mingw64\mingw64\bin",
              "C:\tools\mingw64\bin"
            ) | Where-Object { Test-Path (Join-Path $_ "g++.exe") } | Select-Object -First 1
            if ($dir) { $gpp = Join-Path $dir "g++.exe" }
          }
          if (-not $gpp -and (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Host "installing the mingw64 toolchain into MSYS2"
            & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc"
            if (Test-Path "C:\msys64\mingw64\bin\g++.exe") { $gpp = "C:\msys64\mingw64\bin\g++.exe" }
          }
          if (-not $gpp) { throw "g++.exe not found: the build would ship without the Automix analyser" }
          Split-Path $gpp | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gpp --version | Select-Object -First 1
          (Get-Command ninja.exe).Source
          (Get-Command cmake.exe).Source

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pmyusic.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pmyusic.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Myusic/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/myusic_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/myusic_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/Myusic-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Myusic-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/Myusic-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/Myusic/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pmyusic.version=${{ steps.version.outputs.value }}

      # createDistributable, not packageDmg: the bundle is signed before the
      # DMG is built, so the signature is the one inside the disk image.
      - name: Build the app
        run: |
          ./gradlew :desktopApp:createDistributable \
            -Pmyusic.version=${{ steps.version.outputs.value }}

      - name: Sign the app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="desktopApp/build/compose/binaries/main/app/Myusic.app"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KEYCHAIN="$RUNNER_TEMP/music.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/music.p12"
            security create-keychain -p actions "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p actions "$KEYCHAIN"
            security import "$RUNNER_TEMP/music.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          else
            # Ad-hoc signing is enough for the app to start on Apple Silicon;
            # Gatekeeper still wants the user to clear the quarantine flag.
            codesign --force --deep --sign - "$APP"
          fi

      - name: Build the DMG
        run: |
          v=${{ steps.version.outputs.value }}
          # The stage has to hold the signed bundle itself: pointing hdiutil at a
          # directory that only had the /Applications link made a 5 KB disk image
          # with no app in it, and the job still went green.
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R desktopApp/build/compose/binaries/main/app/Myusic.app "$stage/"
          ln -sfn /Applications "$stage/Applications"
          dmg="Myusic-$v-macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Myusic" -srcfolder "$stage" -ov -format UDZO "$dmg"
          # A DMG that missed the app is a few kilobytes: fail instead of publishing it.
          test "$(stat -f%z "$dmg")" -gt 1000000
          mkdir -p dist
          mv "$dmg" dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*.dmg

  release:
    name: Publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Myusic ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            Android, Windows, Linux, macOS and iOS builds, all produced from this tag by GitHub
            Actions. The IPA is unsigned on purpose: AltStore, SideStore or your own Ad Hoc
            profile signs it, because Myusic is not on the App Store.

            | Platform | File |
            |---|---|
            | Windows 10/11 x64 | `Myusic-<version>-windows-x64-setup.exe`, `.msi`, or the portable ZIP |
            | Linux x86_64 | `Myusic-<version>-linux-x86_64.AppImage`, `.deb` or `.rpm` |
            | macOS 13+ | `Myusic-<version>-macos-arm64.dmg` (Apple Silicon) or `-macos-x64.dmg` (Intel) |
            | Android 8+ phone/tablet | `Myusic-<version>-android-phone-arm64-v8a.apk`, or `-universal` |
            | Android TV | `Myusic-<version>-android-tv-arm64-v8a.apk`, or `-universal` |
            | Wear OS 3+ | `Myusic-<version>-android-wear.apk` |
            | iPhone / iPad (iOS 17+) | `Myusic-<version>-ios-unsigned.ipa` |

            The APKs are signed and install over an older Myusic of the same flavor. The watch app
            only pairs with the phone app signed by the same key. The IPA is unsigned: AltStore,
            SideStore or an Ad Hoc profile signs it with your own Apple ID.

            macOS builds are unsigned unless a Developer ID is configured: right-click the app and
            choose Open the first time, or run `xattr -cr /Applications/Myusic.app`.

            Support: https://saweria.co/latiefahmad
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
