name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./... && go test ./...
        working-directory: backend

  # The Oracle VM belongs to the upstream project owner. Without our own
  # ORACLE_HOST/ORACLE_DEPLOY_KEY secrets this step can only fail, so gate it
  # instead of turning every backend push red.
  deploy:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the Oracle VM
        id: deploy
        env:
          KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          HOST: ${{ secrets.ORACLE_HOST }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No ORACLE_HOST secret; skipping the deployment."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned to /usr/local/sbin/myusic-deploy on the VM.
          ssh -i ~/.ssh/deploy deploy@"$HOST"
      - name: Health check
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://api.bitchord.kushagrasingh.in/healthz && exit 0
            sleep 5
          done
          exit 1
